name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 lua/tests/run_tests.lua

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="2.0.0-dev"; fi
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DFADERPORT_VERSION="$version"
      - name: Build
        run: cmake --build cpp/build --config Release
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.0.0-dev' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $dll = Resolve-Path cpp/build/Release/reaper_4irmann_faderport.dll
          & $iscc "/DAppVersion=$version" "/DDllPath=$dll" installer/windows/reaper-faderport-driver.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: reaper_4irmann_faderport-${{ matrix.os }}
          path: |
            cpp/build/**/reaper_4irmann_faderport.dll
            cpp/build/**/reaper_4irmann_faderport.dylib
            cpp/build/**/reaper_4irmann_faderport.so
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lua-tests, cpp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir release
          # artifact folder layout depends on the files found per platform
          find artifacts -type f \( -name '*-setup.exe' -o -name 'reaper_4irmann_faderport.dll' \
            -o -name 'reaper_4irmann_faderport.dylib' -o -name 'reaper_4irmann_faderport.so' \) \
            -exec cp {} release/ \;
          zip_file="release/reaper-faderport-driver-lua-${GITHUB_REF_NAME}.zip"
          (cd lua && zip -r "../$zip_file" . -x 'tests/*')
          # license (required by Apache 2.0) and manual next to the scripts
          zip -r "$zip_file" LICENSE NOTICE MANUAL.md docs
          unzip -l "$zip_file"
          ls -la release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
